#
# Fail2Ban action: ban/unban IPs via Cloudflare zone-level IP Access Rules,
# authenticated with a scoped API token (no Global API Key needed).
#
# Adapted from fail2ban's bundled cloudflare-token.conf. Credentials are read
# from the container environment (CF_ZONE_ID, CF_API_TOKEN) so they never have
# to be written into this file.
#
# Token permission needed: Zone > Firewall Services > Edit (scoped to the zone).
#
# Banning at the Cloudflare edge is the only option that works here: traffic
# arrives through Cloudflare Tunnel, so host iptables never sees client IPs.
#
# This action depends on curl (and optionally jq).

[Definition]

actionstart =
actionstop =
actioncheck =

actionban = curl -s -o /dev/null -X POST <_cf_api_prms> \
            -d '{"mode":"block","configuration":{"target":"<cftarget>","value":"<ip>"},"notes":"Fail2Ban <name>"}' \
            "<_cf_api_url>"

actionunban = id=$(curl -s -X GET <_cf_api_prms> \
                   "<_cf_api_url>?mode=block&configuration.target=<cftarget>&configuration.value=<ip>&page=1&per_page=1&notes=Fail2Ban%%20<name>" \
                   | { jq -r '.result[0].id' 2>/dev/null || tr -d '\n' | sed -nE 's/^.*"result"\s*:\s*\[\s*\{\s*"id"\s*:\s*"([^"]+)".*$/\1/p'; })
              if [ -z "$id" ] || [ "$id" = "null" ]; then echo "<name>: id for <ip> cannot be found"; exit 0; fi;
              curl -s -o /dev/null -X DELETE <_cf_api_prms> "<_cf_api_url>/$id"

_cf_api_url = https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/firewall/access_rules/rules
_cf_api_prms = -H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json"

[Init]

cftarget = ip

[Init?family=inet6]
cftarget = ip6
