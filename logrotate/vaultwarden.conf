# Host logrotate config for the log files written into the repo folders.
# Install with: sudo sh utils/install_logrotate.sh
# (__REPO_DIR__ is replaced with the absolute repo path on install)

# Vaultwarden reopens LOG_FILE on SIGHUP (it runs as PID 1 in its container),
# so no restart and no copytruncate are needed.
# delaycompress keeps the previous file readable for fail2ban, which may still
# be reading the tail of it right after rotation.
__REPO_DIR__/logs/vaultwarden.log {
    su root root
    weekly
    maxsize 50M
    rotate 12
    dateext
    dateformat -%Y%m%d-%s
    compress
    delaycompress
    missingok
    notifempty
    postrotate
        docker kill --signal=HUP vaultwarden >/dev/null 2>&1 || true
    endscript
}

__REPO_DIR__/fail2ban/fail2ban.log {
    su root root
    weekly
    maxsize 20M
    rotate 8
    dateext
    dateformat -%Y%m%d-%s
    compress
    delaycompress
    missingok
    notifempty
    postrotate
        docker exec fail2ban fail2ban-client flushlogs >/dev/null 2>&1 || true
    endscript
}
